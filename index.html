<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charith Purushotham Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .typing {
      display: inline-block;
      overflow: hidden;
      border-right: 3px solid #333;
      white-space: nowrap;
      width: 0;
      animation: typing 3s steps(30) forwards, blink 0.75s step-end infinite;
    }
    
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    
    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Include header -->
  <div id="header-container"></div>

  <main class="flex flex-col items-center justify-center min-h-screen px-4 sm:px-6 text-center">
    <h2 class="text-2xl sm:text-4xl font-bold w-auto mb-4">
      <span class="typing">Hello, I'm Charith Purushotham</span>
    </h2>
    <p class="text-lg sm:text-xl mt-2 sm:mt-4 max-w-md">
      Data Scientist | Machine Learning Engineer | Software Developer
    </p>
    <a href="portfolio.html" class="mt-6 px-6 py-3 bg-blue-600 text-white text-lg font-bold rounded-lg hover:bg-blue-700 transition duration-300">
      Explore My Work
    </a>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch('header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-container').innerHTML = data;

          const menuToggle = document.getElementById("menu-toggle");
          const menu = document.getElementById("menu");

          if (menuToggle && menu) {
            menuToggle.addEventListener("click", function () {
              menu.classList.toggle("hidden");
              menu.classList.toggle("flex");
              menu.classList.toggle("flex-col");
              menu.classList.toggle("items-center");
            });
          }
        })
        .catch(error => console.error("Error loading header:", error));
    });
  </script>
</body>
</html>
