  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* Fade-in animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }

    /* Social icon hover effects */
    .social-icon {
      transition: all 0.3s ease;
    }

    .social-icon:hover {
      transform: translateY(-5px) scale(1.1);
    }

    /* Gradient background circles */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    .floating {
      animation: float 6s ease-in-out infinite;
    }

    /* Smoothie ambient fluid blobs */
    .fluid-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      mix-blend-mode: screen;
      opacity: 0.55;
      pointer-events: none;
      will-change: transform;
    }
    .dark .fluid-blob {
      mix-blend-mode: lighten;
      opacity: 0.4;
    }
    .fluid-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: -120px; left: -120px;
      animation: fluidDrift1 22s ease-in-out infinite;
    }
    .fluid-2 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      bottom: -160px; right: -120px;
      animation: fluidDrift2 28s ease-in-out infinite;
    }
    .fluid-3 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      top: 40%; left: 50%;
      animation: fluidDrift3 26s ease-in-out infinite;
    }
    @keyframes fluidDrift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(80px, 60px) scale(1.15); }
      66% { transform: translate(-40px, 100px) scale(0.9); }
    }
    @keyframes fluidDrift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-100px, -80px) scale(1.2); }
    }
    @keyframes fluidDrift3 {
      0%, 100% { transform: translate(-50%, 0) scale(1); }
      50% { transform: translate(-50%, -120px) scale(1.3); }
    }

    /* Form field cursor-follow particles via gradient border on focus */
    .input-field {
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.3s ease;
    }
    .input-field:focus {
      transform: translateY(-2px);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15),
                  0 8px 24px rgba(99, 102, 241, 0.2);
    }
    .dark .input-field:focus {
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25),
                  0 8px 24px rgba(139, 92, 246, 0.3);
    }

    /* Contact card hover effect */
    .contact-card {
      transition: all 0.3s ease;
    }

    .contact-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .dark .contact-card:hover {
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
    }
  </style>

  <script>
    // Theme toggle functionality
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

    // Show correct icon on page load
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      themeToggleLightIcon.classList.remove('hidden');
    } else {
      themeToggleDarkIcon.classList.remove('hidden');
    }

    themeToggleBtn.addEventListener('click', function() {
      // Toggle icons
      themeToggleDarkIcon.classList.toggle('hidden');
      themeToggleLightIcon.classList.toggle('hidden');

      // Toggle dark mode
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('color-theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('color-theme', 'dark');
      }
    });

    // Menu toggle functionality
    const menuToggle = document.getElementById("menu-toggle");
    const menu = document.getElementById("menu");

    if (menuToggle && menu) {
      menuToggle.addEventListener("click", function () {
        menu.classList.toggle("hidden");
        menu.classList.toggle("flex");
        menu.classList.toggle("flex-col");
        menu.classList.toggle("items-center");
      });
    }
  </script>
