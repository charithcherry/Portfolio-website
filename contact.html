    body {

    h1,

    /* Custom Cursor */
    .cursor-dot,
    .cursor-outline {
      position: fixed;
      top: 0;
      left: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 9999;
      pointer-events: none;
    }

    .cursor-dot {
      width: 8px;
      height: 8px;
      background-color: #8b5cf6;
      /* Violet-500 */
    }

    .cursor-outline {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(139, 92, 246, 0.5);
      transition: width 0.2s, height 0.2s, background-color 0.2s;
    }

    body.dark .cursor-dot {
      background-color: #a78bfa;
      /* Violet-400 */
    }

    body.dark .cursor-outline {
      border-color: rgba(167, 139, 250, 0.5);
    }

    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .dark .glass {
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Input focus effects */
    .input-field:focus {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .dark .input-field:focus {
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    /* Social icon hover effects */
    .social-icon {
      transition: all 0.3s ease;
    }

    .social-icon:hover {
      transform: translateY(-5px) scale(1.1);
    }

    /* Float animation for background elements */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    .floating {
      animation: float 6s ease-in-out infinite;
    }

    /* Contact card hover effect */
    .contact-card {
      transition: all 0.3s ease;
    }

    .contact-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .dark .contact-card:hover {
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
    }
  </style>
</head>

  <script>
    // Initialize AOS
    AOS.init({
      once: true,
      offset: 50,
      duration: 800,
      easing: 'ease-out-cubic',
    });

    // Custom Cursor Logic
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOutline = document.querySelector('.cursor-outline');

    window.addEventListener('mousemove', (e) => {
      const posX = e.clientX;
      const posY = e.clientY;

      // Using transform for better performance
      cursorDot.style.transform = `translate(${posX}px, ${posY}px) translate(-50%, -50%)`;

      cursorOutline.animate({
        transform: `translate(${posX}px, ${posY}px) translate(-50%, -50%)`
      }, { duration: 500, fill: "forwards" });
    });

    // Theme toggle functionality
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

    // Show correct icon on page load
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      themeToggleLightIcon.classList.remove('hidden');
    } else {
      themeToggleDarkIcon.classList.remove('hidden');
    }

    themeToggleBtn.addEventListener('click', function () {
      // Toggle icons
      themeToggleDarkIcon.classList.toggle('hidden');
      themeToggleLightIcon.classList.toggle('hidden');

      // Toggle dark mode
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('color-theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('color-theme', 'dark');
      }
    });

    // Menu toggle functionality
    const menuToggle = document.getElementById("menu-toggle");
    const menu = document.getElementById("menu");

    if (menuToggle && menu) {
      menuToggle.addEventListener("click", function () {
        menu.classList.toggle("hidden");
        menu.classList.toggle("flex");
        menu.classList.toggle("flex-col");
        menu.classList.toggle("items-center");

        // Add glass effect to mobile menu when open
        if (!menu.classList.contains("hidden")) {
          menu.classList.add("glass");
        } else {
          menu.classList.remove("glass");
        }
      });
    }
  </script>
